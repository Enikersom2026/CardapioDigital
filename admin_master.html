<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | Dom Gabriel Hamburgueria</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        html, body { height: 100%; overflow: hidden; background-color: #0f0f12; color: white; }
        .app-container { display: flex; height: 100vh; width: 100vw; }

        /* MENU LATERAL (SIDEBAR) */
        .sidebar {
            width: 270px;
            background: #141418;
            border-right: 1px solid #29292e;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 22px 16px;
            flex-shrink: 0;
            z-index: 10;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 20px;
            border-bottom: 1px solid #29292e;
            margin-bottom: 18px;
        }

        .sidebar-brand img {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid #3e3e46;
        }

        .sidebar-brand-text h2 {
            font-size: 16px;
            font-weight: 800;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .sidebar-brand-text span {
            font-size: 11px;
            color: #ff4b2b;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .nav-section-title {
            font-size: 10px;
            color: #8d8d99;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            margin: 10px 8px 4px 8px;
        }

        .nav-btn {
            background: transparent;
            color: #c4c4cc;
            border: 1px solid transparent;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .nav-btn:hover {
            background: #202024;
            color: #fff;
            border-color: #29292e;
            transform: translateX(3px);
        }

        .nav-btn.active {
            background: rgba(255, 75, 43, 0.15);
            color: #ff4b2b;
            border-color: rgba(255, 75, 43, 0.4);
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(255, 75, 43, 0.15);
        }

        .sidebar-footer {
            border-top: 1px solid #29292e;
            padding-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-footer {
            background: #202024;
            border: 1px solid #29292e;
            color: #8d8d99;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: 0.2s;
        }

        .btn-footer:hover {
            color: white;
            border-color: #ff4b2b;
        }

        /* CONTEÚDO PRINCIPAL (IFRAME) */
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #0f0f12;
        }

        .content-header {
            height: 56px;
            background: #141418;
            border-bottom: 1px solid #29292e;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }

        .content-header h1 {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .admin-iframe {
            flex: 1;
            width: 100%;
            height: calc(100vh - 56px);
            border: none;
            background: #0f0f12;
        }

        @media (max-width: 820px) {
            .app-container { flex-direction: column; }
            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #29292e;
                padding: 12px;
            }
            .sidebar-nav {
                display: flex;
                flex-direction: row;
                overflow-x: auto;
                white-space: nowrap;
                padding-bottom: 6px;
            }
            .nav-btn { flex-shrink: 0; width: auto; }
            .sidebar-footer { display: none; }
            .content-header { display: none; }
            .admin-iframe { height: calc(100vh - 90px); }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- MENU LATERAL HTML (SIDEBAR) -->
    <aside class="sidebar">
        <div>
            <div class="sidebar-brand">
                <img src="emblema_dom_gabriel.png" alt="Dom Gabriel Logo" onerror="this.src='/emblema_dom_gabriel.png'">
                <div class="sidebar-brand-text">
                    <h2>Dom Gabriel</h2>
                    <span>Painel Administrativo</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section-title">Módulos Oficiais</div>
                <button class="nav-btn active" id="btn-dashboard" onclick="navegarPara('dashboard')">📊 Visão Geral</button>
                <button class="nav-btn" id="btn-logistica" onclick="navegarPara('logistica')">🛵 Logística & Motoboys</button>
                <button class="nav-btn" id="btn-mesas" onclick="navegarPara('mesas')">🍽️ Gerenciador do Salão</button>
                <button class="nav-btn" id="btn-cadastro" onclick="navegarPara('cadastro')">🍔 Cardápio com IA</button>
                <button class="nav-btn" id="btn-config" onclick="navegarPara('config')">⚙️ Configurações</button>
            </nav>
        </div>

        <div class="sidebar-footer">
            <a href="cardapio.html" target="_blank" class="btn-footer">📖 Cardápio do Cliente</a>
            <a href="/" class="btn-footer">🏠 Ir ao App Principal</a>
        </div>
    </aside>

    <!-- ÁREA DE EXIBIÇÃO INTEGRADA -->
    <section class="content-area">
        <div class="content-header">
            <h1 id="titulo-pagina">📊 Visão Geral do Negócio</h1>
            <div style="font-size: 12px; color: #8d8d99;">Dom Gabriel Hamburgueria • Sistema Integrado</div>
        </div>
        <iframe id="admin-frame" class="admin-iframe" src="admin_dashboard.html" title="Módulo Administrativo"></iframe>
    </section>
</div>

<!-- SCRIPT DE ROTAS E NAVEGAÇÃO -->
<script src="admin_rotas.js"></script>
<script>
    // Inicia na rota especificada na URL (ex: ?rota=config) ou na última salva
    document.addEventListener("DOMContentLoaded", () => {
        const params = new URLSearchParams(window.location.search);
        const rotaParam = params.get('rota');
        if (rotaParam && rotas[rotaParam]) {
            navegarPara(rotaParam);
        } else {
            const ultima = sessionStorage.getItem('ultimaRotaAdmin');
            if (ultima && rotas[ultima]) {
                navegarPara(ultima);
            }
        }
    });
</script>
</body>
</html>
