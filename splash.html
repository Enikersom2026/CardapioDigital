<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem-vindo | Dom Gabriel Hamburgueria</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #0f0f12; /* Fundo escuro para combinar com o tema dark */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Container do vídeo ocupando a tela inteira estilo TikTok/Reels */
        .video-splash-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Garante que o vídeo preencha a tela do celular sem distorcer */
            pointer-events: none; /* Impede o cliente de pausar o vídeo clicando na tela */
        }

        /* Efeito de sumiço suave (Fade Out) no final dos 5 segundos */
        .fade-out {
            animation: sumirSuave 0.5s forwards;
        }

        @keyframes sumirSuave {
            from { opacity: 1; }
            to { opacity: 0; visibility: hidden; }
        }
    </style>
</head>
<body>

    <div class="video-splash-container" id="splashContainer">
        <!-- 🚨 ENGENHARIA DO VÍDEO AUTOMÁTICO:
             playsinline: fundamental para rodar dentro do navegador no iPhone
             autoplay: inicia sozinho / muted: obrigatório para o navegador permitir o autoplay
             disabledpictureinpicture: impede o navegador de destacar o vídeo da tela -->
        <video id="videoAnimacao" playsinline autoplay muted disabledpictureinpicture>
            <!-- Busca o vídeo adicionado em /video/ ou raiz -->
            <source src="video/vídeo.mp4" type="video/mp4">
            <source src="/video/vídeo.mp4" type="video/mp4">
            <source src="video/video.mp4" type="video/mp4">
            <source src="/video/video.mp4" type="video/mp4">
            <source src="video/animacao_abertura.mp4" type="video/mp4">
            <source src="/video/animacao_abertura.mp4" type="video/mp4">
            <source src="videos/video.mp4" type="video/mp4">
            <source src="/videos/video.mp4" type="video/mp4">
            <source src="video.mp4" type="video/mp4">
            <source src="/video.mp4" type="video/mp4">
            <source src="animacao_abertura.mp4" type="video/mp4">
            <source src="/animacao_abertura.mp4" type="video/mp4">
            Seu navegador não suporta vídeos.
        </video>
    </div>

    <script>
        const video = document.getElementById('videoAnimacao');
        const container = document.getElementById('splashContainer');

        // Garante a execução forçada caso o navegador bloqueie o autoplay
        video.play().catch(erro => console.log("Aguardando interação ou carregamento do vídeo..."));

        // Conta exatamente 5 segundos (5000 milissegundos), aplica o efeito visual e redireciona
        setTimeout(() => {
            container.classList.add('fade-out');
            
            // Aguarda 500ms da animação de fade-out terminar para mudar de página
            setTimeout(() => {
                // Direciona o usuário para a tela de Login/Cadastro que estruturamos
                window.location.href = "auth.html";
            }, 500);
            
        }, 5000);
    </script>
</body>
</html>
