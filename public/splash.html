<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem-vindo | Dom Gabriel Hamburgueria</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #0f0f12; /* Fundo escuro para combinar com o tema dark */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Container do vídeo ocupando a tela inteira estilo TikTok/Reels */
        .video-splash-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Garante que o vídeo preencha a tela do celular sem distorcer */
            pointer-events: none; /* Impede o cliente de pausar o vídeo clicando na tela */
        }

        /* Efeito de sumiço suave (Fade Out) no final dos 5 segundos */
        .fade-out {
            animation: sumirSuave 0.5s forwards;
        }

        @keyframes sumirSuave {
            from { opacity: 1; }
            to { opacity: 0; visibility: hidden; }
        }
    </style>
</head>
<body>

    <div class="video-splash-container" id="splashContainer">
        <!-- 🚨 ENGENHARIA DO VÍDEO AUTOMÁTICO:
             playsinline: fundamental para rodar dentro do navegador no iPhone
             autoplay: inicia sozinho / muted: obrigatório para o navegador permitir o autoplay
             disabledpictureinpicture: impede o navegador de destacar o vídeo da tela -->
        <video id="videoAnimacao" poster="/poster_abertura.png" playsinline autoplay muted preload="auto" disabledpictureinpicture>
            <!-- Fontes prioritárias limpas (ASCII) -->
            <source src="/video/video.mp4" type="video/mp4">
            <source src="video/video.mp4" type="video/mp4">
            <source src="/animacao_abertura.mp4" type="video/mp4">
            <source src="animacao_abertura.mp4" type="video/mp4">
            <source src="/video.mp4" type="video/mp4">
            <source src="video.mp4" type="video/mp4">
            <source src="/video/vídeo.mp4" type="video/mp4">
            Seu navegador não suporta vídeos.
        </video>
    </div>

    <script>
        const video = document.getElementById('videoAnimacao');
        const container = document.getElementById('splashContainer');

        // Garante as propriedades exigidas por navegadores modernos para autoplay mudo
        video.muted = true;
        video.defaultMuted = true;

        function finalizarSplash() {
            container.classList.add('fade-out');
            setTimeout(() => {
                window.location.href = "auth.html";
            }, 500);
        }

        // Tenta iniciar a reprodução automaticamente
        video.play().catch(erro => {
            console.log("Aguardando toque na tela para iniciar o vídeo:", erro);
        });

        // Tocar na tela inicia o vídeo caso o navegador tenha bloqueado
        document.body.addEventListener('click', () => {
            if (video.paused) {
                video.play().catch(console.warn);
            }
        });

        // Quando o vídeo de 8 segundos terminar naturalmente, redireciona
        video.addEventListener('ended', finalizarSplash);

        // Timer de segurança de 8.5 segundos caso o evento 'ended' não dispare
        setTimeout(finalizarSplash, 8500);
    </script>
</body>
</html>
