<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imprimir QR Codes de Mesa | Dom Gabriel</title>
    <!-- Biblioteca de QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0f0f12; color: white; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        header { width: 100%; max-width: 800px; border-bottom: 1px solid #29292e; padding-bottom: 15px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 20px; color: #ff4b2b; font-weight: 800; display: flex; align-items: center; gap: 8px; }
        .painel-config { background: #1a1a1e; border: 1px solid #29292e; padding: 20px; border-radius: 16px; width: 100%; max-width: 800px; margin-bottom: 25px; }
        .config-grid { display: flex; gap: 16px; flex-wrap: wrap; }
        .config-col-link { flex: 2; min-width: 240px; }
        .config-col-qtd { flex: 1; min-width: 140px; }
        label { display: block; font-size: 13px; color: #c4c4cc; margin-bottom: 6px; font-weight: 600; }
        input { width: 100%; padding: 12px; border: 1px solid #29292e; background: #202024; color: white; border-radius: 8px; font-size: 14px; margin-top: 5px; outline: none; transition: 0.2s; }
        input:focus { border-color: #ff4b2b; }
        .btn-imprimir { background: #00b37e; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; }
        .btn-imprimir:hover { background: #008f64; }
        .grid-tags { width: 100%; max-width: 800px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .card-tag { background: #ffffff; color: #111; padding: 25px 20px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; text-align: center; border: 2px dashed #ff4b2b; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .titulo-mesa { font-size: 24px; font-weight: 800; margin-bottom: 10px; color: #111; }
        .qr-placeholder { background: #f8f9fa; padding: 10px; border-radius: 12px; border: 1px solid #eee; display: flex; justify-content: center; align-items: center; min-width: 130px; min-height: 130px; }
        .qr-placeholder img, .qr-placeholder canvas { display: block; width: 130px; height: 130px; }
        .instrucao { font-size: 12px; font-weight: 600; margin-top: 15px; color: #333; line-height: 1.4; }
        @media print {
            header, .painel-config { display: none !important; }
            body { background: white !important; color: #000 !important; padding: 0 !important; }
            .grid-tags { display: grid !important; grid-template-columns: repeat(3, 1fr) !important; gap: 20px !important; width: 100% !important; }
            .card-tag { box-shadow: none !important; border: 2px dashed #111 !important; page-break-inside: avoid !important; break-inside: avoid !important; }
        }
    </style>
</head>
<body>
    <header>
        <h1>🖨️ Central de Impressão de QR Codes</h1>
        <button class="btn-imprimir" onclick="window.print()">Mandar para Impressora</button>
    </header>
    <div class="painel-config">
        <div class="config-grid">
            <div class="config-col-link">
                <label>Link do seu Cardápio (URL do Servidor):</label>
                <input type="text" id="linkApp" value="https://netlify.app" oninput="gerarTagsMesa()">
            </div>
            <div class="config-col-qtd">
                <label>Quantidade de Mesas:</label>
                <input type="number" id="qtdMesasInput" value="15" min="1" max="60" oninput="salvarEQtdMesas(this.value)">
            </div>
        </div>
    </div>
    <main class="grid-tags" id="wrapperTags"></main>

<script>
    function salvarEQtdMesas(val) {
        const n = parseInt(val) || 15;
        localStorage.setItem('totalMesasLayout', n);
        gerarTagsMesa();
    }

    function gerarTagsMesa() {
        const container = document.getElementById('wrapperTags');
        let urlBase = document.getElementById('linkApp').value.trim();
        if (!urlBase) {
            urlBase = 'https://netlify.app';
        }
        const totalMesas = parseInt(document.getElementById('qtdMesasInput').value) || parseInt(localStorage.getItem('totalMesasLayout')) || 15;
        container.innerHTML = '';

        const separador = urlBase.includes('?') ? '&' : '?';

        for (let i = 1; i <= totalMesas; i++) {
            const card = document.createElement('div');
            card.className = 'card-tag';
            card.innerHTML = `
                <div class="titulo-mesa">MESA ${String(i).padStart(2, '0')}</div>
                <div class="qr-placeholder" id="qr-mesa-${i}"></div>
                <p class="instrucao">Aponte a câmera do celular<br>e faça seu pedido direto!</p>
            `;
            container.appendChild(card);

            const linkCompleto = `${urlBase}${separador}mesa=${i}`;
            const qrHolder = document.getElementById(`qr-mesa-${i}`);

            if (typeof QRCode !== 'undefined') {
                try {
                    new QRCode(qrHolder, {
                        text: linkCompleto,
                        width: 130,
                        height: 130,
                        correctLevel : QRCode.CorrectLevel.H
                    });
                } catch (e) {
                    qrHolder.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=130x130&data=${encodeURIComponent(linkCompleto)}" alt="QR Mesa ${i}" />`;
                }
            } else {
                qrHolder.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=130x130&data=${encodeURIComponent(linkCompleto)}" alt="QR Mesa ${i}" />`;
            }
        }
    }

    document.addEventListener("DOMContentLoaded", () => {
        const inputUrl = document.getElementById('linkApp');
        if (inputUrl && !inputUrl.value) {
            inputUrl.value = 'https://netlify.app';
        }
        const inputQtd = document.getElementById('qtdMesasInput');
        const mesasSalvas = parseInt(localStorage.getItem('totalMesasLayout')) || 15;
        if (inputQtd) {
            inputQtd.value = mesasSalvas;
        }
        gerarTagsMesa();
    });
</script>
</body>
</html>
